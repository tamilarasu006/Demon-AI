<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEMON AI</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:#0a0a0a;
    display:flex;flex-direction:column;
    justify-content:center;align-items:center;
    min-height:100vh;padding:16px;
    font-family:'Share Tech Mono','Courier New',monospace;
  }
  .demon-wrap{
    background:#000;border-radius:10px;overflow:hidden;
    width:100%;max-width:820px;
    box-shadow:0 0 60px rgba(0,180,255,0.15);
    display:flex;flex-direction:column;height:90vh;
  }
  /* title bar */
  .title-bar{
    background:#111;border-bottom:1px solid #1a1a1a;
    display:flex;align-items:center;gap:7px;padding:9px 14px;flex-shrink:0;
  }
  .dot{width:12px;height:12px;border-radius:50%;}
  .dot-r{background:#ff5f57;}.dot-y{background:#febc2e;}.dot-g{background:#28c840;}
  .tb-label{font-size:12px;color:#444;margin-left:8px;letter-spacing:.04em;}
  .tb-status{font-size:11px;margin-left:auto;padding:2px 8px;border-radius:3px;}
  .s-on {color:#28c840;border:1px solid #28c840;}
  .s-off{color:#ff5f57;border:1px solid #ff5f57;}
  .s-think{color:#febc2e;border:1px solid #febc2e;}
  /* ── Wake orb section ── */
  .orb-section{
    background:#050505;border-bottom:1px solid #111;
    display:flex;flex-direction:column;align-items:center;
    padding:20px 0 14px;gap:8px;flex-shrink:0;
  }
  .orb-ring{
    position:relative;
    width:90px;height:90px;
    display:flex;align-items:center;justify-content:center;
  }
  /* ripple rings */
  .ripple{
    position:absolute;inset:0;border-radius:50%;
    border:2px solid rgba(0,180,255,0.25);
    animation:rippleOut 2.5s ease-out infinite;
    pointer-events:none;
  }
  .ripple:nth-child(2){animation-delay:.8s;}
  .ripple:nth-child(3){animation-delay:1.6s;}
  @keyframes rippleOut{
    0%{transform:scale(1);opacity:.6;}
    100%{transform:scale(2.2);opacity:0;}
  }
  .orb{
    width:80px;height:80px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#0cf,#005577);
    border:2px solid #0af;
    cursor:pointer;z-index:1;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 24px rgba(0,180,255,0.35);
    transition:transform .15s,box-shadow .15s,background .3s,border-color .3s;
  }
  .orb:hover{transform:scale(1.05);box-shadow:0 0 36px rgba(0,180,255,0.6);}
  /* states */
  .orb.idle   {background:radial-gradient(circle at 35% 35%,#0cf,#005577);border-color:#0af;box-shadow:0 0 24px rgba(0,180,255,0.35);}
  .orb.wake   {background:radial-gradient(circle at 35% 35%,#4af,#007799);border-color:#4af;box-shadow:0 0 36px rgba(0,200,255,0.5);animation:orbPulse 1.8s ease-in-out infinite;}
  .orb.listen {background:radial-gradient(circle at 35% 35%,#f55,#880000);border-color:#f44;box-shadow:0 0 36px rgba(255,60,60,0.65);animation:orbPulse .7s ease-in-out infinite;}
  .orb.think  {background:radial-gradient(circle at 35% 35%,#fa0,#664400);border-color:#fa0;box-shadow:0 0 36px rgba(255,170,0,0.6); animation:orbPulse 1s ease-in-out infinite;}
  .orb.speak  {background:radial-gradient(circle at 35% 35%,#2e2,#004400);border-color:#2e2;box-shadow:0 0 36px rgba(40,220,40,0.65);animation:orbPulse .5s ease-in-out infinite;}
  @keyframes orbPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.1);}}
  .orb svg{width:36px;height:36px;fill:#fff;pointer-events:none;}
  /* wave bars */
  .wave-bars{display:flex;gap:3px;align-items:flex-end;height:20px;opacity:0;transition:opacity .2s;}
  .wave-bars.active{opacity:1;}
  .wave-bars span{width:3px;background:#0cf;border-radius:2px;animation:wb .6s ease-in-out infinite;}
  .wave-bars span:nth-child(1){height:5px; animation-delay:0s;}
  .wave-bars span:nth-child(2){height:12px;animation-delay:.1s;}
  .wave-bars span:nth-child(3){height:20px;animation-delay:.2s;}
  .wave-bars span:nth-child(4){height:12px;animation-delay:.3s;}
  .wave-bars span:nth-child(5){height:5px; animation-delay:.4s;}
  @keyframes wb{0%,100%{transform:scaleY(1);}50%{transform:scaleY(.25);}}
  /* orb label */
  .orb-label{font-size:12px;color:#444;letter-spacing:.1em;text-transform:uppercase;text-align:center;}
  .orb-label.wake  {color:#4af;}
  .orb-label.listen{color:#f55;}
  .orb-label.think {color:#fa0;}
  .orb-label.speak {color:#2e2;}
  /* wake word hint */
  .wake-hint{font-size:11px;color:#333;letter-spacing:.06em;}
</style>
<style>
  /* terminal */
  .terminal-body{flex:1;overflow-y:auto;padding:14px 24px 10px;position:relative;scroll-behavior:smooth;}
  .terminal-body::-webkit-scrollbar{width:4px;}
  .terminal-body::-webkit-scrollbar-track{background:#000;}
  .terminal-body::-webkit-scrollbar-thumb{background:#222;border-radius:2px;}
  .scanline{pointer-events:none;position:absolute;inset:0;
    background:repeating-linear-gradient(to bottom,transparent 0,transparent 3px,rgba(0,0,0,0.10) 3px,rgba(0,0,0,0.10) 4px);z-index:10;}
  .flash-overlay{position:absolute;inset:0;background:rgba(0,180,255,0.02);pointer-events:none;z-index:9;animation:flicker 10s infinite;}
  @keyframes flicker{0%,100%{opacity:1}94%{opacity:1}95%{opacity:0.7}96%{opacity:1}98%{opacity:0.85}99%{opacity:1}}
  .line{font-size:13.5px;line-height:1.7;margin-bottom:1px;white-space:pre-wrap;word-break:break-word;}
  .line-prompt{color:#0af;}.line-user{color:#ddd;}.line-ai{color:#aaa;}
  .line-error{color:#f55;}.line-info{color:#555;}
  .prompt-user{color:#0af;}.prompt-at{color:#444;}.prompt-dir{color:#0cf;}.prompt-sym{color:#555;}
  .thinking{color:#febc2e;animation:pulse 1.2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
  /* input bar */
  .input-bar{
    background:#0d0d0d;border-top:1px solid #1a1a1a;
    display:flex;align-items:center;padding:8px 14px;gap:8px;flex-shrink:0;
  }
  .input-prompt{color:#0af;font-size:12px;white-space:nowrap;flex-shrink:0;}
  #userInput{
    flex:1;background:transparent;border:none;outline:none;
    color:#ddd;font-family:'Share Tech Mono',monospace;font-size:13px;caret-color:#0cf;
  }
  #userInput::placeholder{color:#252525;}
  .btn{
    background:transparent;font-family:'Share Tech Mono',monospace;
    font-size:11px;padding:4px 10px;border-radius:3px;
    cursor:pointer;transition:background .15s;white-space:nowrap;flex-shrink:0;
  }
  #sendBtn{border:1px solid #0af;color:#0af;}
  #sendBtn:hover{background:rgba(0,170,255,0.1);}
  #sendBtn:disabled{opacity:.35;cursor:not-allowed;}
  #ttsToggle{border:1px solid #333;color:#555;font-size:15px;padding:3px 9px;}
  #ttsToggle.on{border-color:#2e2;color:#2e2;}
  /* wake-activate btn */
  #wakeBtn{border:1px solid #444;color:#444;font-size:11px;padding:4px 10px;}
  #wakeBtn.watching{border-color:#0af;color:#0af;animation:pulse 2s ease-in-out infinite;}

  /* ── Attachment button ── */
  #attachBtn{
    border:1px solid #333;color:#555;font-size:17px;padding:2px 8px;
    position:relative;
  }
  #attachBtn:hover{border-color:#0af;color:#0af;background:rgba(0,170,255,0.08);}

  /* ── Attachment popup menu ── */
  .attach-menu{
    position:absolute;bottom:56px;left:0;
    background:#141414;border:1px solid #222;border-radius:10px;
    padding:6px 0;min-width:220px;
    box-shadow:0 8px 32px rgba(0,0,0,0.7);
    z-index:100;display:none;
    font-family:'Share Tech Mono',monospace;
  }
  .attach-menu.open{display:block;animation:menuIn .15s ease;}
  @keyframes menuIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .attach-menu-item{
    display:flex;align-items:center;gap:12px;
    padding:10px 18px;cursor:pointer;font-size:13px;color:#bbb;
    transition:background .12s,color .12s;position:relative;
  }
  .attach-menu-item:hover{background:#1e1e1e;color:#0cf;}
  .attach-menu-item .icon{font-size:18px;width:22px;text-align:center;flex-shrink:0;}
  .attach-menu-item .badge{
    font-size:9px;background:#0af;color:#000;border-radius:4px;
    padding:1px 5px;margin-left:auto;font-weight:bold;letter-spacing:.04em;
  }
  .attach-divider{height:1px;background:#1e1e1e;margin:4px 0;}
  .attach-submenu-arrow{margin-left:auto;color:#444;font-size:11px;}

  /* ── Attached file preview chips ── */
  .attach-preview{
    background:#0d0d0d;border-top:1px solid #1a1a1a;
    padding:6px 14px;display:none;flex-wrap:wrap;gap:6px;
    flex-shrink:0;
  }
  .attach-preview.has-files{display:flex;}
  .file-chip{
    display:flex;align-items:center;gap:6px;
    background:#1a1a1a;border:1px solid #2a2a2a;border-radius:6px;
    padding:4px 10px;font-size:11px;color:#aaa;max-width:180px;
  }
  .file-chip .chip-icon{font-size:14px;}
  .file-chip .chip-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:110px;}
  .file-chip .chip-remove{cursor:pointer;color:#555;margin-left:4px;}
  .file-chip .chip-remove:hover{color:#f55;}
</style>
</head>
<body>
<div class="demon-wrap">

  <!-- title bar -->
  <div class="title-bar">
    <div class="dot dot-r"></div><div class="dot dot-y"></div><div class="dot dot-g"></div>
    <span class="tb-label">DEMON AI &mdash; Voice Assistant</span>
    <span class="tb-status s-off" id="statusBadge">connecting...</span>
  </div>

  <!-- orb / wake section -->
  <div class="orb-section">
    <div class="orb-ring">
      <div class="ripple"></div>
      <div class="ripple"></div>
      <div class="ripple"></div>
      <div class="orb idle" id="orb" title="Click or say Hey DEMON">
        <!-- mic icon -->
        <svg viewBox="0 0 24 24"><path d="M12 1a4 4 0 0 1 4 4v6a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm6.5 9a.5.5 0 0 1 .5.5 7 7 0 0 1-6.5 6.97V20h2.5a.5.5 0 0 1 0 1h-6a.5.5 0 0 1 0-1H11v-2.53A7 7 0 0 1 4.5 10.5a.5.5 0 0 1 1 0 6 6 0 0 0 12 0 .5.5 0 0 1 .5-.5z"/></svg>
      </div>
    </div>
    <div class="wave-bars" id="waveBars">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="orb-label" id="orbLabel">say "hey demon" or click</div>
    <div class="wake-hint" id="wakeHint">always listening for wake word</div>
  </div>

  <!-- terminal output -->
  <div class="terminal-body" id="tBody">
    <div class="scanline"></div><div class="flash-overlay"></div>
    <div id="lines"></div>
  </div>

  <!-- attached files preview strip -->
  <div class="attach-preview" id="attachPreview"></div>

  <!-- text input bar -->
  <div class="input-bar" style="position:relative;">

    <!-- attachment popup menu -->
    <div class="attach-menu" id="attachMenu">
      <div class="attach-menu-item" id="menuUploadFiles">
        <span class="icon">📎</span> Upload files
      </div>
      <div class="attach-menu-item" id="menuUploadImage">
        <span class="icon">🖼️</span> Photos &amp; images
      </div>
      <div class="attach-menu-item" id="menuImportCode">
        <span class="icon">&#x3C;&#x3E;</span> Import code
      </div>
      <div class="attach-divider"></div>
      <div class="attach-menu-item" id="menuCanvas">
        <span class="icon">🖊️</span> Canvas <span class="badge">NEW</span>
      </div>
      <div class="attach-menu-item" id="menuScreenshot">
        <span class="icon">📸</span> Screenshot
      </div>
      <div class="attach-menu-item" id="menuPaste">
        <span class="icon">📋</span> Paste text / JSON
      </div>
    </div>

    <!-- hidden file inputs -->
    <input type="file" id="fileInputAny"    style="display:none" multiple accept="*/*"/>
    <input type="file" id="fileInputImage"  style="display:none" multiple accept="image/*"/>
    <input type="file" id="fileInputCode"   style="display:none" multiple accept=".py,.js,.ts,.html,.css,.json,.yaml,.yml,.md,.txt,.sh,.c,.cpp,.h,.java,.rs,.go,.rb,.php,.sql"/>

    <span class="input-prompt">
      <span class="prompt-user">(demon)</span>
      <span class="prompt-user"> user</span><span class="prompt-at">@</span><span class="prompt-user">DEMON-AI</span>
      <span class="prompt-at">:</span><span class="prompt-dir">~/DEMON</span><span class="prompt-sym">$</span>
    </span>
    <input id="userInput" type="text" placeholder="or type here and press Enter..." autocomplete="off" spellcheck="false"/>
    <button class="btn" id="attachBtn" title="Attach files">📎</button>
    <button class="btn" id="wakeBtn">WAKE OFF</button>
    <button class="btn" id="ttsToggle" title="Voice reply">🔊</button>
    <button class="btn" id="sendBtn">SEND</button>
  </div>
</div>

<script>
const API_BASE = 'http://localhost:8080';
const WAKE_WORDS = ['hey demon','hay demon','hey,demon','hi demon'];
const STOP_WORDS = ['stop','cancel','nevermind','never mind','quiet','shut up'];

// ── DOM refs ─────────────────────────────────────────────────────────────────
const orb        = document.getElementById('orb');
const orbLabel   = document.getElementById('orbLabel');
const wakeHint   = document.getElementById('wakeHint');
const waveBars   = document.getElementById('waveBars');
const linesEl    = document.getElementById('lines');
const tBody      = document.getElementById('tBody');
const inputEl    = document.getElementById('userInput');
const sendBtn    = document.getElementById('sendBtn');
const wakeBtn    = document.getElementById('wakeBtn');
const ttsToggle  = document.getElementById('ttsToggle');
const statusBadge= document.getElementById('statusBadge');

// ── Attachment refs ───────────────────────────────────────────────────────────
const attachBtn      = document.getElementById('attachBtn');
const attachMenu     = document.getElementById('attachMenu');
const attachPreview  = document.getElementById('attachPreview');
const fileInputAny   = document.getElementById('fileInputAny');
const fileInputImage = document.getElementById('fileInputImage');
const fileInputCode  = document.getElementById('fileInputCode');

// Stores {name, type, content (base64 or text)} for each attached file
let attachedFiles = [];

// ── Toggle menu open/close ────────────────────────────────────────────────────
attachBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  attachMenu.classList.toggle('open');
});
document.addEventListener('click', () => attachMenu.classList.remove('open'));
attachMenu.addEventListener('click', (e) => e.stopPropagation());

// ── Menu item handlers ────────────────────────────────────────────────────────
document.getElementById('menuUploadFiles').addEventListener('click', () => {
  attachMenu.classList.remove('open');
  fileInputAny.click();
});
document.getElementById('menuUploadImage').addEventListener('click', () => {
  attachMenu.classList.remove('open');
  fileInputImage.click();
});
document.getElementById('menuImportCode').addEventListener('click', () => {
  attachMenu.classList.remove('open');
  fileInputCode.click();
});
document.getElementById('menuScreenshot').addEventListener('click', async () => {
  attachMenu.classList.remove('open');
  try {
    const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
    const track  = stream.getVideoTracks()[0];
    const cap    = new ImageCapture(track);
    const bmp    = await cap.grabFrame();
    track.stop();
    const canvas = document.createElement('canvas');
    canvas.width = bmp.width; canvas.height = bmp.height;
    canvas.getContext('2d').drawImage(bmp, 0, 0);
    const b64 = canvas.toDataURL('image/png').split(',')[1];
    addAttachedFile({ name: 'screenshot.png', type: 'image/png', content: b64, isBase64: true });
    addLine('<span style="color:#555">Screenshot captured.</span>');
  } catch(e) {
    addLine('<span style="color:#555">Screenshot cancelled or not supported.</span>');
  }
});
document.getElementById('menuPaste').addEventListener('click', async () => {
  attachMenu.classList.remove('open');
  try {
    const text = await navigator.clipboard.readText();
    if (text.trim()) {
      addAttachedFile({ name: 'pasted.txt', type: 'text/plain', content: text, isBase64: false });
      addLine('<span style="color:#555">Clipboard content attached (' + text.length + ' chars).</span>');
    }
  } catch(e) {
    addLine('<span style="color:#555">Clipboard access denied. Paste manually into the text box.</span>');
  }
});
document.getElementById('menuCanvas').addEventListener('click', () => {
  attachMenu.classList.remove('open');
  addLine('<span style="color:#555">Canvas mode: draw or write in the text box below.</span>');
});

// ── Read files from input elements ────────────────────────────────────────────
function handleFileInput(files) {
  Array.from(files).forEach(file => {
    const reader = new FileReader();
    const isImage = file.type.startsWith('image/');
    if (isImage) {
      reader.onload = e => {
        const b64 = e.target.result.split(',')[1];
        addAttachedFile({ name: file.name, type: file.type, content: b64, isBase64: true, size: file.size });
      };
      reader.readAsDataURL(file);
    } else {
      reader.onload = e => {
        addAttachedFile({ name: file.name, type: file.type, content: e.target.result, isBase64: false, size: file.size });
      };
      reader.readAsText(file);
    }
  });
}

fileInputAny.addEventListener('change',   e => { handleFileInput(e.target.files); e.target.value=''; });
fileInputImage.addEventListener('change', e => { handleFileInput(e.target.files); e.target.value=''; });
fileInputCode.addEventListener('change',  e => { handleFileInput(e.target.files); e.target.value=''; });

// ── Add a file to the attached list and show preview chip ─────────────────────
function fileIcon(type, name) {
  if (type.startsWith('image/'))   return '🖼️';
  if (type.includes('pdf'))        return '📄';
  if (type.includes('json'))       return '{}';
  if (name.match(/\.(py|js|ts|html|css|sh|c|cpp|java|rs|go)$/i)) return '💻';
  if (name.match(/\.(md|txt)$/i))  return '📝';
  return '📎';
}

function addAttachedFile(fileObj) {
  attachedFiles.push(fileObj);
  renderPreviews();
  addLine('<span style="color:#0af">Attached:</span> <span style="color:#888">' + escHtml(fileObj.name) + ' (' + (fileObj.size ? Math.round(fileObj.size/1024)+'KB' : 'clipboard') + ')</span>');
}

function renderPreviews() {
  if (attachedFiles.length === 0) {
    attachPreview.innerHTML = '';
    attachPreview.classList.remove('has-files');
    return;
  }
  attachPreview.classList.add('has-files');
  attachPreview.innerHTML = attachedFiles.map((f, i) =>
    `<div class="file-chip">
      <span class="chip-icon">${fileIcon(f.type, f.name)}</span>
      <span class="chip-name" title="${escHtml(f.name)}">${escHtml(f.name)}</span>
      <span class="chip-remove" data-idx="${i}" title="Remove">✕</span>
    </div>`
  ).join('');
  attachPreview.querySelectorAll('.chip-remove').forEach(el => {
    el.addEventListener('click', () => {
      attachedFiles.splice(parseInt(el.dataset.idx), 1);
      renderPreviews();
    });
  });
}

// ── Build context string from attached files ──────────────────────────────────
function buildFileContext() {
  if (attachedFiles.length === 0) return '';
  let ctx = '\n\n--- Attached Files ---\n';
  attachedFiles.forEach(f => {
    if (f.isBase64) {
      ctx += `[Image: ${f.name}] (base64 image attached)\n`;
    } else {
      const preview = f.content.length > 8000 ? f.content.slice(0, 8000) + '\n...(truncated)' : f.content;
      ctx += `\n[File: ${f.name}]\n\`\`\`\n${preview}\n\`\`\`\n`;
    }
  });
  return ctx;
}

// ── state ─────────────────────────────────────────────────────────────────────
let mode         = 'idle';   // idle | wake-watching | listening | thinking | speaking
let ttsOn        = true;
let wakeWatching = false;
let wakeRec      = null;    // continuous wake-word recognition
let cmdRec       = null;    // single-shot command recognition
const SpeechRec  = window.SpeechRecognition || window.webkitSpeechRecognition;
const hasSpeech  = !!SpeechRec;

// ── helpers ───────────────────────────────────────────────────────────────────
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

function addLine(html, cls){
  const d=document.createElement('div');
  d.className='line '+(cls||'line-info');
  d.innerHTML=html;
  linesEl.appendChild(d);
  tBody.scrollTop=tBody.scrollHeight;
  return d;
}
function addBlank(){ addLine('&nbsp;','line-info'); }
function escHtml(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function promptHtml(t){
  return `<span class="prompt-user">(demon)</span> <span class="prompt-user">user</span><span class="prompt-at">@</span><span class="prompt-user">DEMON-AI</span><span class="prompt-at">:</span><span class="prompt-dir">~/DEMON</span><span class="prompt-sym">$ </span><span class="line-user">${escHtml(t)}</span>`;
}

function setStatus(s){
  statusBadge.textContent = s;
  statusBadge.className = 'tb-status '+(s==='online'?'s-on':s==='thinking'?'s-think':'s-off');
}

function setMode(m){
  mode = m;
  orb.className = 'orb ' + (m==='idle'?'idle': m==='wake-watching'?'wake': m==='listening'?'listen': m==='thinking'?'think': m==='speaking'?'speak':'idle');
  waveBars.classList.toggle('active', m==='listening'||m==='wake-watching');
  orbLabel.className = 'orb-label '+(m==='wake-watching'?'wake': m==='listening'?'listen': m==='thinking'?'think': m==='speaking'?'speak':'');

  const labels = {
    'idle':          'say "hey demon" or click',
    'wake-watching': 'listening for wake word...',
    'listening':     'listening — speak now',
    'thinking':      'thinking...',
    'speaking':      'speaking...',
  };
  orbLabel.textContent = labels[m] || m;
}
</script>

<script>
// ── TTS ───────────────────────────────────────────────────────────────────────
ttsToggle.classList.toggle('on', ttsOn);
ttsToggle.addEventListener('click', ()=>{
  ttsOn = !ttsOn;
  ttsToggle.classList.toggle('on', ttsOn);
  addLine('<span style="color:#555">Voice reply '+(ttsOn?'ON':'OFF')+'</span>');
});

// ── OpenAI TTS (nova voice) ───────────────────────────────────────────────────
let currentAudio = null;

function speak(text){
  if(!ttsOn) return Promise.resolve();
  // stop any playing audio
  if(currentAudio){ currentAudio.pause(); currentAudio=null; }
  if(window.speechSynthesis) window.speechSynthesis.cancel();

  return new Promise(async resolve=>{
    setMode('speaking');
    try{
      const res = await fetch(API_BASE+'/v1/tts',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ text, voice:'nova', speed:1.0 }),
        signal: AbortSignal.timeout(20000)
      });
      if(!res.ok){ throw new Error('TTS error '+res.status); }
      const blob = await res.blob();
      const url  = URL.createObjectURL(blob);
      currentAudio = new Audio(url);
      currentAudio.onended  = ()=>{ URL.revokeObjectURL(url); currentAudio=null; resolve(); };
      currentAudio.onerror  = ()=>{ URL.revokeObjectURL(url); currentAudio=null; resolve(); };
      currentAudio.play();
    } catch(e){
      // fallback to browser TTS if OpenAI TTS fails
      if(window.speechSynthesis){
        const utt = new SpeechSynthesisUtterance(text);
        utt.onend = utt.onerror = ()=>resolve();
        window.speechSynthesis.speak(utt);
      } else {
        resolve();
      }
    }
  });
}

function stopSpeaking(){
  if(currentAudio){ currentAudio.pause(); currentAudio=null; }
  if(window.speechSynthesis) window.speechSynthesis.cancel();
}

// ── Wake-word continuous listener ─────────────────────────────────────────────
function startWakeWatcher(){
  if(!hasSpeech || wakeWatching) return;
  wakeWatching = true;
  wakeBtn.textContent = 'WAKE ON';
  wakeBtn.classList.add('watching');
  setMode('wake-watching');
  wakeHint.textContent = 'always listening — say "hey demon"';
  _runWakeLoop();
}

function stopWakeWatcher(){
  wakeWatching = false;
  wakeBtn.textContent = 'WAKE OFF';
  wakeBtn.classList.remove('watching');
  if(wakeRec){ try{ wakeRec.stop(); }catch(e){} wakeRec=null; }
  if(mode==='wake-watching') setMode('idle');
  wakeHint.textContent = 'wake word OFF — click orb or type';
}

function _runWakeLoop(){
  if(!wakeWatching) return;
  wakeRec = new SpeechRec();
  wakeRec.lang = 'en-US';
  wakeRec.continuous = false;
  wakeRec.interimResults = false;

  wakeRec.onresult = (e)=>{
    const said = e.results[e.results.length-1][0].transcript.toLowerCase().trim();
    const triggered = WAKE_WORDS.some(w=>said.startsWith(w)||said.includes(w));
    if(triggered){
      // Extract command after wake word
      let cmd = said;
      for(const w of WAKE_WORDS){
        if(said.includes(w)){
          cmd = said.slice(said.indexOf(w)+w.length).trim();
          break;
        }
      }
      addLine('<span style="color:#0af">wake word detected</span> <span style="color:#555">— "'+escHtml(said)+'"</span>');
      if(cmd.length > 2){
        // Command was spoken in same breath
        handleCommand(cmd);
      } else {
        // Activate to listen for the command
        activateListening();
      }
    }
  };

  wakeRec.onend = ()=>{
    wakeRec = null;
    if(wakeWatching && (mode==='wake-watching'||mode==='idle')){
      setTimeout(()=>_runWakeLoop(), 200);
    }
  };

  wakeRec.onerror = (e)=>{
    wakeRec = null;
    if(e.error==='not-allowed'){
      addLine('<span style="color:#f55">Microphone blocked. Allow mic in browser settings.</span>','line-error');
      stopWakeWatcher(); return;
    }
    if(wakeWatching) setTimeout(()=>_runWakeLoop(), 500);
  };

  try{ wakeRec.start(); } catch(e){ setTimeout(()=>_runWakeLoop(), 500); }
}

// ── Command listener (after wake) ─────────────────────────────────────────────
function activateListening(){
  if(!hasSpeech) return;
  if(wakeRec){ try{wakeRec.stop();}catch(e){} wakeRec=null; }
  setMode('listening');
  speak('Yes?').then(()=>{
    _listenForCommand();
  });
}

function _listenForCommand(){
  cmdRec = new SpeechRec();
  cmdRec.lang = 'en-US';
  cmdRec.continuous = false;
  cmdRec.interimResults = true;

  cmdRec.onresult = (e)=>{
    const transcript = Array.from(e.results).map(r=>r[0].transcript).join('');
    inputEl.value = transcript;
    if(e.results[e.results.length-1].isFinal){
      cmdRec = null;
      handleCommand(transcript.trim());
    }
  };

  cmdRec.onerror = (e)=>{
    cmdRec = null;
    if(e.error!=='no-speech') addLine('<span style="color:#555">Listening error: '+e.error+'</span>');
    if(wakeWatching){ setMode('wake-watching'); _runWakeLoop(); }
    else setMode('idle');
  };

  cmdRec.onend = ()=>{
    if(cmdRec){ cmdRec=null; }
    // If no result came through, restart wake watcher
    if(mode==='listening'){
      if(wakeWatching){ setMode('wake-watching'); _runWakeLoop(); }
      else setMode('idle');
    }
  };

  try{ cmdRec.start(); } catch(e){ setMode('idle'); }
}
</script>

<script>
// ── Handle a command ──────────────────────────────────────────────────────────
async function handleCommand(text){
  if(!text || mode==='thinking') return;
  if(cmdRec){ try{cmdRec.stop();}catch(e){} cmdRec=null; }

  // stop command
  if(STOP_WORDS.some(w=>text.toLowerCase().includes(w))){
    if(currentAudio){ currentAudio.pause(); currentAudio=null; }
    if(window.speechSynthesis) window.speechSynthesis.cancel();
    addLine('<span style="color:#555">Stopped.</span>');
    if(wakeWatching){ setMode('wake-watching'); setTimeout(()=>_runWakeLoop(),300); }
    else setMode('idle');
    return;
  }

  // Build full prompt including file context
  const fileCtx = buildFileContext();
  const fullPrompt = text + fileCtx;

  inputEl.value = '';
  setMode('thinking');
  setStatus('thinking');

  // Show user message with attachment count indicator
  const attachCount = attachedFiles.length;
  const attachNote = attachCount > 0 ? ` <span style="color:#0af">[+${attachCount} file${attachCount>1?'s':''}]</span>` : '';
  addLine(promptHtml(text) + attachNote, 'line-prompt');
  const thinkEl = addLine('<span class="thinking">⬤ DEMON is thinking...</span>', 'line-ai');

  // Clear attachments after sending
  attachedFiles = [];
  renderPreviews();

  try{
    const res = await fetch(API_BASE+'/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model:'gpt-4o-mini',
        messages:[{role:'user',content:fullPrompt}],
        stream:false
      }),
      signal: AbortSignal.timeout(30000)
    });

    thinkEl.remove();

    if(!res.ok){
      const err = await res.text();
      let msg = err.slice(0,300);
      try{ msg = JSON.parse(err)?.error?.message || msg; }catch(e){}
      if(res.status===429){
        const errText = 'OpenAI quota exceeded. Add credits at platform.openai.com/billing';
        addLine('<span style="color:#f55">'+escHtml(errText)+'</span>','line-error');
        speak(errText);
      } else {
        addLine('<span style="color:#f55">Error '+res.status+': '+escHtml(msg)+'</span>','line-error');
      }
    } else {
      const data = await res.json();
      const reply = data?.choices?.[0]?.message?.content || data?.response || JSON.stringify(data);
      addLine('<span style="color:#0cf">DEMON:</span> '+escHtml(reply),'line-ai');
      addBlank();
      await speak(reply);
    }
  } catch(e){
    thinkEl.remove();
    const msg = e.name==='TimeoutError'?'Request timed out.':'Connection error: '+e.message;
    addLine('<span style="color:#f55">'+escHtml(msg)+'</span>','line-error');
    speak(msg);
  }

  setStatus('online');
  // Resume wake watching after response
  if(wakeWatching){
    setMode('wake-watching');
    setTimeout(()=>_runWakeLoop(), 500);
  } else {
    setMode('idle');
  }
}

// ── Orb click = manual listen ─────────────────────────────────────────────────
orb.addEventListener('click', ()=>{
  if(mode==='listening'){ // cancel
    if(cmdRec){ try{cmdRec.stop();}catch(e){} cmdRec=null; }
    setMode(wakeWatching?'wake-watching':'idle');
    if(wakeWatching) setTimeout(()=>_runWakeLoop(),300);
  } else if(mode==='idle'||mode==='wake-watching'){
    activateListening();
  }
});

// ── Wake button toggle ────────────────────────────────────────────────────────
wakeBtn.addEventListener('click', ()=>{
  if(wakeWatching) stopWakeWatcher();
  else startWakeWatcher();
});

// ── Text input send ───────────────────────────────────────────────────────────
sendBtn.addEventListener('click', ()=>{ const t=inputEl.value.trim(); if(t) handleCommand(t); });
inputEl.addEventListener('keydown', e=>{ if(e.key==='Enter'){ const t=inputEl.value.trim(); if(t) handleCommand(t); } });
</script>

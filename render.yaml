services:
  - type: web
    name: opendemon
    runtime: python
    rootDir: .
    buildCommand: pip install uv && uv pip install --system ".[server]"
    startCommand: python src/render_start.py
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: NVIDIA_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEMON_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: opendemon
      - key: PYTHON_VERSION
        value: "3.12"
    autoDeploy: true
